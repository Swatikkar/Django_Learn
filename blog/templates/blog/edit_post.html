{% extends 'blog/index.html' %}

{% block title %}Edit Post | My Blog{% endblock %}

{% block content %}
<h1 class="text-2xl font-bold mb-4">Edit Post</h1>

<form method="POST" enctype="multipart/form-data">
    {% csrf_token %}
    <label class="block mb-2 font-semibold">Title</label>
    <input type="text" name="title" value="{{ post.title }}" class="w-full p-2 border rounded mb-4" required>

    <label class="block mb-2 font-semibold">Content</label>
    <textarea name="content" rows="5" class="w-full p-2 border rounded mb-4" required>{{ post.content }}</textarea>

    <label class="block mb-2 font-semibold">Image (optional)</label>
    <input type="file" name="image" class="mb-4">
    {% if post.image %}
        <img src="{{ post.image.url }}" alt="{{ post.title }}" class="w-48 h-auto mb-4">
    {% endif %}

    <button type="submit" class="px-4 py-2 bg-blue-600 text-white rounded hover:bg-blue-700">Update Post</button>
    <a href="{% url 'home' %}" class="ml-4 text-gray-600 hover:underline">Cancel</a>
</form>

{% endblock %}
