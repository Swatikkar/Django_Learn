<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}My Blog{% endblock %}</title>
    <!-- THIS SCRIPT IS CRITICAL FOR TAILWIND TO WORK -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            /* The overall page background is light gray */
            background-color: #F3F4F6;
            font-family: 'Inter', sans-serif;
        }
    </style>
</head>
<body class="bg-gray-100 font-sans leading-normal tracking-normal">

    <nav class="bg-gray-800 text-white shadow-lg">
        <div class="container mx-auto px-4 py-3 flex items-center justify-between">
            <!-- Left-side navigation links -->
            <div class="flex items-center space-x-8">
                <a href="{% url 'home' %}" class="text-sm font-medium text-gray-300 hover:text-white transition duration-300">Home</a>
                <a href="{% url 'about' %}" class="text-sm font-medium text-gray-300 hover:text-white transition duration-300">About</a>
                <a href="{% url 'myfeeds' %}" class="text-sm font-medium text-gray-300 hover:text-white transition duration-300">My Feeds</a>
            </div>
            
            <!-- Right-side authentication/profile link -->
            <div class="flex items-center space-x-4">
                {% if user.is_authenticated %}
                    <!-- LOGGED IN: Show Profile Icon and Logout Link -->
                    <!-- <a href="{% url 'logout' %}" class="text-sm font-medium text-gray-300 hover:text-white transition duration-300">Logout</a> -->
                    <form action="{% url 'logout' %}" method="post" class="inline">
                        {% csrf_token %}
                        <button type="submit" class="text-sm font-medium text-gray-300 hover:text-white transition duration-300 bg-transparent border-none p-0 cursor-pointer">
                            Logout
                        </button>
                    </form>
                {% else %}
                    <!-- LOGGED OUT: Show Sign In / Sign Up Link (redirects to register) -->
                    <a href="{% url 'register' %}" class="text-sm font-medium text-gray-300 hover:text-white transition duration-300">Sign In / Sign Up</a>
                {% endif %}
            </div>
        </div>
    </nav>
    
    <main class="container mx-auto mt-8 px-4">
        {% block content %}{% endblock %}
    </main>
    
</body>
</html>
