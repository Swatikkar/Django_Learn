{% extends 'blog/index.html' %}

{% block title %}Confirm Delete | My Blog{% endblock %}

{% block content %}
<h1 class="text-2xl font-bold mb-4">Confirm Delete</h1>
<p>Are you sure you want to delete the post titled "<strong>{{ post.title }}</strong>"?</p>

<form method="POST" class="mt-4">
    {% csrf_token %}
    <button type="submit" class="px-4 py-2 bg-red-600 text-white rounded hover:bg-red-700">Yes, Delete</button>
    <a href="{% url 'home' %}" class="ml-4 text-gray-600 hover:underline">Cancel</a>
</form>

{% endblock %}
