<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}My Blog{% endblock %}</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 font-sans leading-normal tracking-normal">

    <nav class="bg-gray-800 text-white shadow-lg">
        <div class="container mx-auto px-4 py-3 flex items-center justify-between">
            <div class="flex items-center space-x-8">
                <!-- <a href="{% url 'home' %}" class="text-2xl font-bold text-gray-100 hover:text-white transition duration-300">My Blog</a> -->
                <a href="{% url 'home' %}" class="text-sm font-medium text-gray-300 hover:text-white transition duration-300">Home</a>
                <a href="{% url 'about' %}" class="text-sm font-medium text-gray-300 hover:text-white transition duration-300">About</a>
                <a href="{% url 'myfeeds' %}" class="text-sm font-medium text-gray-300 hover:text-white transition duration-300">My Feeds</a>
            </div>
            <div class="flex items-center space-x-4">
                <a href="{% url 'register' %}" class="text-sm font-medium text-gray-300 hover:text-white transition duration-300">Sign In / Sign Up</a>
            </div>
        </div>
    </nav>
    
    <main class="container mx-auto mt-8 px-4">
        {% block content %}{% endblock %}
    </main>
    
</body>
</html>
