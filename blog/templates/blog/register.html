<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register | My Blog</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            background-color: #1a202c; /* A deep, dark background */
            font-family: 'Inter', sans-serif;
        }
    </style>
</head>
<body class="flex items-center justify-center min-h-screen">

    <div class="w-full max-w-lg bg-gray-800 p-8 rounded-lg shadow-2xl md:shadow-2xl border border-gray-700">
        {% if messages %}
            {% for message in messages %}
                <div class="p-4 mb-4 rounded-lg
                    {% if 'error' in message.tags or 'warning' in message.tags %}
                        bg-red-800 text-white
                    {% elif 'success' in message.tags %}
                        bg-green-800 text-white
                    {% else %}
                        bg-gray-700 text-white
                    {% endif %}
                ">
                {{ message }}
                </div>
            {% endfor %}
        {% endif %}
        <h1 class="text-3xl font-bold text-gray-100 text-center mb-6">Create Your Account</h1>

        <form method="post" enctype="multipart/form-data">
            {% csrf_token %}
            
            <!-- Full Name -->
            <div class="mb-4">
                <label for="full_name" class="block text-gray-300 text-sm font-semibold mb-2">Full Name <span class="text-red-400">*</span></label>
                <input type="text" id="full_name" name="full_name" required class="w-full px-4 py-2 bg-gray-700 border border-gray-600 text-white rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 placeholder-gray-400">
            </div>

            <!-- Email ID -->
            <div class="mb-4">
                <label for="email" class="block text-gray-300 text-sm font-semibold mb-2">Email ID <span class="text-red-400">*</span></label>
                <input type="email" id="email" name="email" required class="w-full px-4 py-2 bg-gray-700 border border-gray-600 text-white rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 placeholder-gray-400">
            </div>

            <!-- Username -->
            <div class="mb-4">
                <label for="username" class="block text-gray-300 text-sm font-semibold mb-2">Username <span class="text-red-400">*</span></label>
                <input type="text" id="username" name="username" required class="w-full px-4 py-2 bg-gray-700 border border-gray-600 text-white rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 placeholder-gray-400">
            </div>

            <!-- Password -->
            <div class="mb-4">
                <label for="password" class="block text-gray-300 text-sm font-semibold mb-2">Password <span class="text-red-400">*</span></label>
                <input type="password" id="password" name="password" required class="w-full px-4 py-2 bg-gray-700 border border-gray-600 text-white rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 placeholder-gray-400">
            </div>

            <!-- Confirm Password -->
            <div class="mb-6">
                <label for="confirm_password" class="block text-gray-300 text-sm font-semibold mb-2">Confirm Password <span class="text-red-400">*</span></label>
                <input type="password" id="confirm_password" name="confirm_password" required class="w-full px-4 py-2 bg-gray-700 border border-gray-600 text-white rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 placeholder-gray-400">
            </div>

            <!-- Bio -->
            <div class="mb-4">
                <label for="bio" class="block text-gray-300 text-sm font-semibold mb-2">Bio (Optional)</label>
                <textarea id="bio" name="bio" rows="4" class="w-full px-4 py-2 bg-gray-700 border border-gray-600 text-white rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 placeholder-gray-400"></textarea>
            </div>

            <!-- Profile Pic -->
            <div class="mb-6">
                <label for="profile_pic" class="block text-gray-300 text-sm font-semibold mb-2">Profile Picture (Optional)</label>
                <input type="file" id="profile_pic" name="profile_pic" class="w-full text-gray-300 text-sm">
            </div>

            <!-- Submit Button -->
            <div class="flex items-center justify-center">
                <button type="submit" class="w-full bg-blue-600 text-white font-semibold py-2 px-4 rounded-lg hover:bg-blue-500 transition duration-300 focus:outline-none focus:ring-2 focus:ring-blue-500">
                    Register
                </button>
            </div>
        </form>

        <p class="text-center text-sm text-gray-400 mt-4">
            Already have an account? <a href="{% url 'login' %}" class="text-blue-500 hover:underline">Log In</a>
        </p>
    </div>

</body>
</html>
