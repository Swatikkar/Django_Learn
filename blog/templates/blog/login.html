<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log In | My Blog</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            background-color: #1a202c; /* A deep, dark background */
            font-family: 'Inter', sans-serif;
        }
    </style>
</head>
<body class="flex items-center justify-center min-h-screen">

    <div class="w-full max-w-sm bg-gray-800 p-8 rounded-lg shadow-2xl md:shadow-2xl border border-gray-700">
         {% if messages %}
            {% for message in messages %}
                <div class="p-4 mb-4 rounded-lg
                    {% if 'error' in message.tags or 'warning' in message.tags %}
                        bg-red-800 text-white
                    {% elif 'success' in message.tags %}
                        bg-green-800 text-white
                    {% else %}
                        bg-gray-700 text-white
                    {% endif %}
                ">
                {{ message }}
                </div>
            {% endfor %}
        {% endif %}
        <h1 class="text-3xl font-bold text-gray-100 text-center mb-6">Log In</h1>

        <form method="post" action="{% url 'login_page' %}">
            {% csrf_token %}
            
            <!-- Username -->
            <div class="mb-4">
                <label for="username" class="block text-gray-300 text-sm font-semibold mb-2">Username</label>
                <input type="text" id="username" name="username" required class="w-full px-4 py-2 bg-gray-700 border border-gray-600 text-white rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 placeholder-gray-400">
            </div>

            <!-- Password -->
            <div class="mb-6">
                <label for="password" class="block text-gray-300 text-sm font-semibold mb-2">Password</label>
                <input type="password" id="password" name="password" required class="w-full px-4 py-2 bg-gray-700 border border-gray-600 text-white rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 placeholder-gray-400">
            </div>

            <!-- Log In Button -->
            <div class="flex items-center justify-center">
                <button type="submit" class="w-full bg-blue-600 text-white font-semibold py-2 px-4 rounded-lg hover:bg-blue-500 transition duration-300 focus:outline-none focus:ring-2 focus:ring-blue-500">
                    Log In
                </button>
            </div>
        </form>

        <p class="text-center text-sm text-gray-400 mt-4">
            Don't have an account? <a href="{% url 'register' %}" class="text-blue-500 hover:underline">Register</a>
        </p>
    </div>

</body>
</html>
